name: release

# Publishes the Ubuntu installer as a GitHub Release asset when a vX.Y.Z tag is pushed.
# The tag is the only trigger: nothing is built on ordinary branch pushes, and a tag whose
# version does not match build.gradle.kts fails the run instead of publishing a wrong artifact.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish .deb
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out the tagged source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Validate the tag
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if [[ ! "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "::error::Tag '${tag}' is not a valid release tag (expected vMAJOR.MINOR.PATCH[-PRERELEASE])."
            exit 1
          fi
          # Compose packaging requires a numeric version (the MSI target rejects pre-release suffixes),
          # so the tag may carry a suffix but the .deb is built as the numeric core only.
          release_version="${tag#v}"
          package_version="${release_version%%-*}"
          project_version="$(./gradlew --console=plain -q printVersion | tail -n 1 | tr -d '[:space:]')"
          if [[ "${project_version}" != "${package_version}" ]]; then
            echo "::error::Tag '${tag}' does not match build.gradle.kts version '${project_version}'."
            echo "::error::Bump 'version' in build.gradle.kts to ${package_version} before tagging."
            exit 1
          fi
          if [[ "${release_version}" == "${package_version}" ]]; then
            echo "::warning::Tag '${tag}' has no pre-release suffix; this publishes a normal release."
          fi
          echo "Releasing ${release_version} (packaging version ${package_version})"

      - name: Build and verify the installer
        run: ./scripts/build-installer.sh

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          release_version="${GITHUB_REF_NAME#v}"
          # build-installer.sh publishes exactly one verified installer under build/release.
          mapfile -t debs < <(find build/release -maxdepth 1 -type f -name '*.deb' | sort)
          if [[ "${#debs[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one installer in build/release, found ${#debs[@]}."
            printf '  %s\n' "${debs[@]:-none}" >&2
            exit 1
          fi
          deb="${debs[0]}"
          asset="$(basename "${deb}")"
          # Guard against publishing a stale artifact: the upstream version must match the tag.
          actual="$(dpkg-deb -f "${deb}" Version | cut -d- -f1)"
          if [[ "${actual}" != "${release_version%%-*}" ]]; then
            echo "::error::Installer version ${actual} does not match tag ${GITHUB_REF_NAME}."
            exit 1
          fi

          notes="$(printf '%s\n' \
            "Denti-Code ${release_version} — instalador de Ubuntu." \
            "" \
            "\`\`\`bash" \
            "sudo apt install ./${asset}" \
            "\`\`\`" \
            "" \
            "Los datos del usuario se guardan en \`~/.denti-code-kt/\` y no se modifican al instalar o actualizar.")"

          # Re-running a tag (deleted and re-pushed) must update the existing release rather than
          # fail, so publishing is idempotent: create it the first time, replace the asset after.
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists; refreshing it."
            gh release edit "${GITHUB_REF_NAME}" \
              --title "Denti-Code ${release_version}" \
              --notes "${notes}"
            gh release upload "${GITHUB_REF_NAME}" "${deb}#${asset}" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" \
              --title "Denti-Code ${release_version}" \
              --notes "${notes}" \
              "${deb}#${asset}"
          fi

          # Deleting a tag also deletes its release, and that deletion is applied asynchronously. If
          # the tag is re-pushed immediately, the pending deletion can land on the release created
          # just now, leaving no release behind a "successful" run. Verify instead of assuming.
          sleep 20
          echo "::group::release state after publishing"
          gh release list || true
          gh api "repos/${GITHUB_REPOSITORY}/releases" --jq '.[] | "\(.tag_name) draft=\(.draft) assets=\(.assets | length)"' || true
          echo "::endgroup::"
          if ! gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}" --jq .tag_name >/dev/null 2>&1; then
            echo "::error::The release is missing after publishing. gh release list above shows the real state."
            echo "::error::If the tag was re-pushed right after being deleted, wait ~1 minute and re-push it."
            exit 1
          fi
          echo "Release ${GITHUB_REF_NAME} is live with asset ${asset}."
